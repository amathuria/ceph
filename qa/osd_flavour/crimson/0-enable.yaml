# Crimson OSD enablement fragment (used when a suite picks osd_flavour/crimson).
#
# Teuthology merges this YAML with other suite fragments into one job config.
# This file has three top-level sections:
#
#   tasks:     shell commands / teuthology tasks to run on the cluster
#   overrides: settings merged into the final job (ceph.conf, task knobs, etc.)
#   teuthology: Lua scripts that run after merge (filter jobs, fix task order)
#
# Typical job task order after postmerge:
#   install  ->  pexec (this file)  ->  ceph  ->  workloads...
#
# Classic-only jobs use osd_flavour/classic/ and never load this file.

# ---------------------------------------------------------------------------
# tasks: things teuthology runs on the test machines (in list order, unless
# postmerge below reorders them).
# ---------------------------------------------------------------------------
tasks:
  # pexec: run shell commands on all cluster nodes ("all:").
  #
  # We do NOT add a second "install:" task here. Crimson RPMs are requested via
  # overrides.install.ceph.extra_packages in postmerge (see bottom of file).
  # That avoids teuthology deep_merge errors when workloads also set extras.
  # Postmerge appends crimson packages to the install task (dict or list; see bottom).
  #
  # This pexec block only switches /usr/bin/ceph-osd to the crimson binary.
  # It must run after "install" and before "ceph" (postmerge enforces that).
  - pexec:
      all:
        # Block 1: point the ceph-osd alternative at crimson (RPM vs Debian paths).
        - |
          set -euo pipefail
          if [ -x /usr/bin/ceph-osd-crimson ]; then
            sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd-crimson
          elif [ -x /usr/bin/ceph-osd ]; then
            # Debian/Ubuntu: select crimson implementation (classic is provided
            # separately as /usr/bin/ceph-osd-classic).
            sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd
          else
            echo "No ceph-osd binary found to select" >&2
            exit 1
          fi
        # Blocks 2-3: debug logging to teuthology.log (helps confirm the right binary).
        - |
          set -euo pipefail
          echo "== ceph-osd alternative selection =="
          sudo update-alternatives --display ceph-osd || true
          echo "== ceph-osd path resolution =="
          readlink -f /usr/bin/ceph-osd || true
          ls -l /usr/bin/ceph-osd /usr/bin/ceph-osd-classic 2>/dev/null || true
        - |
          set -euo pipefail
          echo "== ceph-osd exec path (what tasks will run) =="
          which ceph-osd || true
          real="$(readlink -f "$(command -v ceph-osd)" 2>/dev/null || true)"
          echo "ceph-osd resolves to: ${real}"
          if [ -n "${real}" ] && [ -e "${real}" ]; then
            echo "== rpm owner of ceph-osd binary =="
            rpm -qf "${real}" || true
            echo "== binary build-id and sha256 =="
            readelf -n "${real}" 2>/dev/null | sed -n '1,80p' || true
            sha256sum "${real}" || true
          fi

# ---------------------------------------------------------------------------
# overrides: merged into the job config under the top-level "overrides:" key.
# Nested keys target specific teuthology tasks or ceph config sections.
# ---------------------------------------------------------------------------
overrides:
  # "ceph" overrides feed into the teuthology "ceph" task (cluster bring-up).
  ceph:
    # Tell teuthology helpers this is a crimson cluster (not classic ceph-osd).
    crimson_compat: true
    conf:
      # conf.global / mon / osd map to ceph.conf sections [global], [mon], [osd].
      global:
        enable experimental unrecoverable data corrupting features: crimson
        # Crimson's dispatcher chain (mgrc/monc/heartbeat) is not yet
        # safe against connection shard migration triggered by
        # repeated reconnects, so disable msgr fault injection for
        # crimson runs.  Remove once the dispatcher home-shard hop
        # is in place.  This overrides any msgr-failures/* axis that
        # sets these knobs in `global`; teuthology fragment merge
        # order applies osd_flavour after msgr-failures.
        ms inject socket failures: 0
        ms inject delay probability: 0
        ms inject internal delays: 0
      mon:
        # New pools default to crimson OSDs (see also cephadm osd_type below).
        osd pool default crimson: true
      osd:
        # Crimson + SeaStore + EC can be CPU-hungry; 1 shard is easy to stall.
        # Suites can still override for perf or tiny clusters.
        crimson cpu num: 4

  # Only used when the suite runs the teuthology "cephadm" task (not legacy ceph).
  cephadm:
    osd_type: crimson

  # Only used when the suite runs RGW workloads.
  # Same as qa/suites/crimson-rados/rgw/sts/pool-type.yaml: do not use an EC RGW
  # data pool. Crimson + EC is still easy to hit bugs in; suites can override.
  rgw:
    ec-data-pool: false

  # Only used when the suite runs teuthology "workunit" tasks.
  # See qa/workunits/cls/test_cls_refcount.sh for what this skips.
  workunit:
    env:
      CRIMSON_SKIP_EC_TESTS: "1"

  # Only used when the suite runs teuthology "thrashosds".
  # Match qa/suites/crimson-rados/thrash/thrashers/default.yaml: disable actions
  # that assume classic OSD (OpTracker, ceph-objectstore-tool, dump_blocked_ops).
  # min_in / chance_down are intentionally NOT set here — those belong in each
  # suite's thrasher fragment (cluster size varies).
  thrashosds:
    ceph_objectstore_tool: false
    dump_ops_enable: false
    optrack_toggle_delay: 0
    sighup_delay: 0
    noscrub_toggle_delay: 0
    chance_thrash_pg_upmap: 0
    reweight_osd: 0
    thrash_primary_affinity: false
    chance_inject_pause_short: 0
    chance_thrash_cluster_full: 0
    chance_reset_purged_snaps_last: 0
    chance_trim_stale_osdmaps: 0

# ---------------------------------------------------------------------------
# teuthology: special keys interpreted by teuthology itself (not ceph).
#
# postmerge: Lua run once per job AFTER all YAML fragments are merged.
#   - reject() drops the job (not scheduled)
#   - accept() / fall-through keeps the job
#   - can edit the merged yaml (tasks, overrides) before scheduling
# ---------------------------------------------------------------------------
teuthology:
  postmerge:
    - |
      local y = py_attrgetter(yaml)

      -- (1) OS filter: skip jobs on Ubuntu (no crimson packages in CI yet).
      local os_type = y.get('os_type')
      if os_type == 'ubuntu' then
        log.debug('skipping crimson OSD on ubuntu: builds not ready')
        reject()
      end

      -- (1b) CephFS filters: skip jobs that need classic-only OSD setups.
      -- client_full / mds-full force memstore; EC facets need cephfs.ec_profile.
      if description:find('client_full', 1, true) then
        log.debug('skipping crimson: CephFS client_full uses memstore')
        reject()
      end
      if description:find('mds%-full', 1, false) then
        log.debug('skipping crimson: CephFS mds-full uses memstore')
        reject()
      end
      if description:find('objectstore%-ec', 1, false) then
        log.debug('skipping crimson: CephFS EC data pool (objectstore-ec)')
        reject()
      end
      if description:find('bluestore%-ec%-root', 1, false) then
        log.debug('skipping crimson: CephFS EC data pool (bluestore-ec-root)')
        reject()
      end

      -- (1c) RBD filters: qa/rbd/data-pool/ec.yaml sets allow_ec_overwrites and
      -- forces classic bluestore; fails on crimson OSD (exec exit 22 at bring-up).
      -- CRIMSON_SKIP_EC_TESTS only skips some workunits, not this cluster setup.
      if description:find('data%-pool/ec', 1, false) then
        log.debug('skipping crimson: RBD EC data pool (data-pool/ec)')
        reject()
      end

      -- (2) Install extras: add ceph-osd-crimson packages for the install task.
      --
      -- Teuthology requires extra_packages to be either a list OR a deb/rpm dict
      -- everywhere in one job — never mixed. CephFS uses dict form on the install
      -- task (qa/cephfs/begin/0-install.yaml); RBD/RGW use list overrides.
      -- For dict form, append directly to the install task's deb/rpm lists (no new
      -- dict in Lua — py_tuple/py_dict are awkward in the postmerge sandbox).
      -- For list form, set overrides.install.ceph.extra_packages as a flat list.
      local function extra_packages_is_dict(ep)
        if ep == nil then
          return false
        end
        local s = tostring(ep)
        return s:find("'deb'", 1, false) ~= nil or s:find("'rpm'", 1, false) ~= nil
      end

      local function append_unique(lst, pkg)
        for _, p in py_enumerate(lst) do
          if tostring(p) == pkg then
            return
          end
        end
        py_attrgetter(lst).append(pkg)
      end

      local function copy_list_into(target, src)
        if src == nil then
          return
        end
        for _, p in py_enumerate(src) do
          append_unique(target, tostring(p))
        end
      end

      local function add_crimson_to_dict_ep(ep)
        local epa = py_attrgetter(ep)
        local deb = epa.get('deb')
        local rpm = epa.get('rpm')
        if deb ~= nil then
          append_unique(deb, 'ceph-osd-crimson')
          append_unique(deb, 'ceph-osd-crimson-debuginfo')
        end
        if rpm ~= nil then
          append_unique(rpm, 'ceph-osd-crimson')
          append_unique(rpm, 'ceph-osd-crimson-debuginfo')
        end
      end

      local tasks = y.get('tasks')
      local install_task_ep = nil
      if tasks ~= nil then
        for _, t in py_enumerate(tasks) do
          local inst = py_attrgetter(t).get('install')
          if inst ~= nil then
            install_task_ep = py_attrgetter(inst).get('extra_packages')
            break
          end
        end
      end

      local overrides = y.get('overrides')
      local install_ov = nil
      local ceph_ov = nil
      local ov_ep = nil
      if overrides ~= nil then
        install_ov = py_attrgetter(overrides).get('install')
        if install_ov ~= nil then
          ceph_ov = py_attrgetter(install_ov).get('ceph')
          if ceph_ov ~= nil then
            ov_ep = py_attrgetter(ceph_ov).get('extra_packages')
          end
        end
      end

      if extra_packages_is_dict(install_task_ep) then
        add_crimson_to_dict_ep(install_task_ep)
        -- A list override would dict+list merge and break scheduling.
        if ceph_ov ~= nil and ov_ep ~= nil and not extra_packages_is_dict(ov_ep) then
          py_attrgetter(ceph_ov).pop('extra_packages', nil)
        end
      elseif extra_packages_is_dict(ov_ep) then
        add_crimson_to_dict_ep(ov_ep)
      else
        if overrides == nil then
          overrides = py_dict()
        end
        if install_ov == nil then
          install_ov = py_dict()
        end
        if ceph_ov == nil then
          ceph_ov = py_dict()
        end
        local pkgs = py_list()
        if ov_ep ~= nil then
          for _, p in py_enumerate(ov_ep) do
            append_unique(pkgs, tostring(p))
          end
        end
        append_unique(pkgs, 'ceph-osd-crimson')
        append_unique(pkgs, 'ceph-osd-crimson-debuginfo')
        ceph_ov['extra_packages'] = pkgs
        install_ov['ceph'] = ceph_ov
        overrides['install'] = install_ov
        local ov_upd = py_dict()
        ov_upd['overrides'] = overrides
        y.update(ov_upd)
      end

      -- (3) Task order: move our pexec block to immediately after the first
      -- "install" task so alternatives are set before "ceph" starts OSDs.
      if tasks == nil then
        return
      end

      local function is_crimson_switch(t)
        local s = tostring(t)
        return s:find('update%-alternatives %-%-set ceph%-osd', 1, false) ~= nil
      end

      local to_move = py_list()
      local rest = py_list()
      for _, t in py_enumerate(tasks) do
        if is_crimson_switch(t) then
          py_attrgetter(to_move).append(t)
        else
          py_attrgetter(rest).append(t)
        end
      end

      if py_len(to_move) > 0 then
        local new_tasks = py_list()
        local nt = py_attrgetter(new_tasks)
        local inserted = false
        for _, r in py_enumerate(rest) do
          nt.append(r)
          if not inserted then
            local s = tostring(r)
            if s:find("'install'", 1, false) ~= nil then
              for _, m in py_enumerate(to_move) do nt.append(m) end
              inserted = true
            end
          end
        end
        if not inserted then
          for _, m in py_enumerate(to_move) do nt.append(m) end
        end
        local upd = py_dict()
        upd['tasks'] = new_tasks
        y.update(upd)
      end
