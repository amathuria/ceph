overrides:
  ceph:
    crimson_compat: true
    conf:
      global:
        enable experimental unrecoverable data corrupting features: crimson
      mon:
        osd pool default crimson: true
      osd:
        crimson cpu num: 1
        osd objectstore: seastore
        debug seastore: 20
        debug seastore onode: 20
        debug seastore odata: 20
        debug seastore omap: 20
        debug seastore tm: 20
        debug seastore t: 20
        debug seastore cleaner: 20
        debug seastore epm: 20
        debug seastore lba: 20
        debug seastore fixedkv tree: 20
        debug seastore cache: 20
        debug seastore journal: 20
        debug seastore device: 20
        debug seastore backref: 20

  cephadm:
    osd_type: crimson

teuthology:
  postmerge:
    # Prepend tasks so the OSD binary is selected before `ceph-osd --mkfs`.
    - |
      local prefix = yaml_load([[
      - install:
          extra_packages:
            deb: []
            rpm:
              - ceph-osd-crimson
              - ceph-osd-crimson-debuginfo
      - pexec:
          all:
            - |
              set -euo pipefail
              if [ -x /usr/bin/ceph-osd-crimson ]; then
                sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd-crimson
              elif [ -x /usr/bin/ceph-osd ]; then
                sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd
              else
                echo "No ceph-osd binary found to select" >&2
                exit 1
              fi
      ]])
      local y = py_attrgetter(yaml)
      if y.get('tasks') == nil then
        local init = py_dict()
        init['tasks'] = py_list()
        y.update(init)
      end
      local new_tasks = py_list()
      for i, t in py_enumerate(prefix) do
        new_tasks:append(t)
      end
      for i, t in py_enumerate(y.get('tasks')) do
        new_tasks:append(t)
      end
      local upd = py_dict()
      upd['tasks'] = new_tasks
      y.update(upd)
