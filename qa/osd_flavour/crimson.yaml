tasks:
  # For legacy (non-cephadm) suites, install the crimson OSD package and switch
  # the ceph-osd alternative before the suite's main 'ceph' task starts daemons.
  - install:
      extra_packages:
        # Debian/Ubuntu publish crimson as `ceph-osd` (with classic split out as
        # `ceph-osd-classic`), so `ceph-osd-crimson` may not exist there.
        deb: []
        rpm:
          - ceph-osd-crimson
          - ceph-osd-crimson-debuginfo
  - pexec:
      all:
        - |
          set -euo pipefail
          if [ -x /usr/bin/ceph-osd-crimson ]; then
            sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd-crimson
          elif [ -x /usr/bin/ceph-osd ]; then
            # Debian/Ubuntu: select crimson implementation (classic is provided
            # separately as /usr/bin/ceph-osd-classic).
            sudo update-alternatives --set ceph-osd /usr/bin/ceph-osd
          else
            echo "No ceph-osd binary found to select" >&2
            exit 1
          fi
        - |
          set -euo pipefail
          echo "== ceph-osd alternative selection =="
          sudo update-alternatives --display ceph-osd || true
          echo "== ceph-osd path resolution =="
          readlink -f /usr/bin/ceph-osd || true
          ls -l /usr/bin/ceph-osd /usr/bin/ceph-osd-classic 2>/dev/null || true

overrides:
  ceph:
    crimson_compat: true
    conf:
      global:
        enable experimental unrecoverable data corrupting features: crimson
      mon:
        osd pool default crimson: true
      osd:
        # A safe default for teuthology jobs; suites can override for perf.
        crimson cpu num: 1

  # cephadm-based suites deploy OSDs via the cephadm task. "osd_type: crimson"
  # switches the orchestrated OSD implementation.
  cephadm:
    osd_type: crimson
